# --- fixture bootstrap (TE §15.3; R-133 limb 5, control 37) -----------------------------
# TRANSCRIBED VERBATIM from identity_declaration.yaml. TE §15.3 requires ONE bootstrap
# execution at REDUCED replicate count on fixture 2, for TIMING. These are apparatus
# constants (R-122) and are NOT `experiment.yaml` values: the confirmatory bootstrap
# remains 10,000 replicates at seed 20221201 with 24-hour vector blocks carrying all three
# stations together (TE §13.6; TC-19), and nothing here amends it.
#
# The divisibility the loader re-checks: 336 h / 24 h = 14 whole blocks; 336 h / 48 h = 7.
# Evaluated at freeze rather than discovered inside the run (control 37).
fixture_bootstrap:
  replicates: 1000
  scored_range:
    hours: 336
  block_counts:
    24h: 14
    48h: 7
