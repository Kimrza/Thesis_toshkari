# tests/fixtures/scientific_1month/fixture_manifest.yaml — TE §15.2 fixture manifest.
#
# Purpose: the STRUCTURAL skeleton of the one-month all-station scientific fixture's
#   manifest, written 2026-09-20 under the approved governance remediation of
#   Recommendation 37 (option 2, first step).
# Inputs: `tests/fixtures/scientific_1month/identity_declaration.yaml` (the owner's Q-31
#   identity declaration, adopted 2026-09-13 under CR-2026-09-13-000102-FIXTURE-WINDOW) —
#   every identity field, every input hash, the apparatus-partition set and the
#   `fixture_bootstrap` block below are TRANSCRIBED from it verbatim, never re-derived.
#   `PreFlight/Technical_Environment_and_Research_Implementation(1)(2).md` §15.2 (the
#   twelve content areas), §15.3 (the reduced-replicate bootstrap) and §15.4 (the
#   required-output enumeration).
# Re-run behaviour: read-only data. `load_fixture_manifest` is the ONE read path
#   (R-133 control 4). This file is never edited by code.
#
# ─────────────────────────────────────────────────────────────────────────────────────
# WHAT THIS FILE IS NOT
#
# It is NOT frozen and it is NOT loadable-clean. `load_fixture_manifest` will REFUSE it,
# by name, at the first MEASURED field — and that refusal is the intended outcome.
#
# TE §15.1: "exact counts, tolerances, and runtimes are measured from the fixtures and
# frozen; they are not invented here." Neither fixture has ever run. NO measured figure is
# written below. Every measured quantity carries the literal sentinel `TBD — freeze gate`
# and deliberately carries NO `measuring_run_id`, which is what makes `_validate_measured`
# (R-134 control 8) refuse it. Inventing a `measuring_run_id` to make the loader pass would
# disguise an unmeasured manifest as a measured one — the worst available outcome.
#
# SEQUENCING, which this fixture does not get to skip: TE §9.2 and R-140 control 26
# require a VERIFIED `plumbing_7day` receipt before a scientific measuring run. Both
# fixtures must pass, in order, before any full-year job.
#
# BLK-02 is UNAFFECTED and stays OPEN: no measured value was written here.
# ─────────────────────────────────────────────────────────────────────────────────────

fixture_id: scientific_1month

status: candidate

# --- TE §15.2 area 1 of 12 — Identity ------------------------------------------------
identity:
  fixture_id: scientific_1month
  stations:
    - ARUC
    - BSHM
    - NICO
  station_cells:
    ARUC: "40/44"
    BSHM: "32/35"
    NICO: "35/33"
  utc_dates: "2022-03-01..2022-03-31"
  selection_rule: >-
    D-14 (verbatim rationale): regime separation — D-11's frozen seven-day plumbing window
    is 2022-11-01 to 2022-11-07, so placing the scientific fixture in a different season
    means the two fixtures probe different diurnal and seasonal structure; March is an
    equinox month. Measured coverage — March is the best-covered eligible month outside
    January and February (ARUC 99.5%, BSHM 99.9%, NICO 97.8% in-month hourly) with
    raw_isprint_cache/ present.
  creator: >-
    Kimia Rezaei (student; Q-31 assigns fixture station, dates and acceptance tolerances
    to the Student, TE §18.2)
  approval_status: >-
    adopted 2026-09-13 under Q-31 (student-owned; owner FINAL RULING of 2026-09-13,
    CR-2026-09-13-000102-FIXTURE-WINDOW; no supervisor countersignature required per
    team.md § Walking Skeleton). The IDENTITY is adopted; the MANIFEST is not frozen —
    status above is `candidate`.
  window_citation:
    decision: D-14
    start_utc: "2022-03-01"
    end_utc: "2022-03-31"
  # `station_citation` (D-20) belongs to plumbing_7day ONLY and its presence here would be
  # REFUSED: scientific_1month runs all cited stations under D-14.
  limitations:
    december_representativeness: not_representative
    clauses:
      - >-
        March 2022 is an equinox month and does not reproduce December's winter-solstice
        regime or its activity distribution.
      - >-
        It is not representative of the locked test month, and no fixture result may be
        read as evidence about December behaviour.
  data07_caveat: >-
    DATA-07: this month's provenance is unverifiable in principle, not merely unverified —
    no provider byte stream exists anywhere in the workspace, and the provider-side term of
    the hash arithmetic is zero. Three of the twelve months (2022-04, 2022-07 and 2022-12,
    the locked month) hold no raw_isprint_cache/ at all. The 2026-08-16 corrected extracts
    were produced under Python 3.14, outside the governed 3.11 pin. FULL must not be relied
    on at a freeze gate while its provenance chain points at superseded per-month hashes
    (team.md § Walking Skeleton).
  eligibility_evidence:
    decision: D-14
    source: >-
      evidence/audit_evidence_2022-03/madrigal_coverage_raw_records.csv (D-14 measured
      basis: in-month hourly coverage ARUC 99.5%, BSHM 99.9%, NICO 97.8%)
  phase_id: P1A
  source_id: GNSS_VTEC
  target_definition_id: GRIDDed_VTEC_1H
  # `freeze_citation` is required only when status is `frozen`; deliberately absent.

