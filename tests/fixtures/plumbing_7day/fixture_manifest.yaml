# tests/fixtures/plumbing_7day/fixture_manifest.yaml — TE §15.2 fixture manifest.
#
# Purpose: the STRUCTURAL skeleton of the seven-day single-station plumbing fixture's
#   manifest, written 2026-09-20 under the approved governance remediation of
#   Recommendation 37 (option 2, first step). Until now `src/data/fixture_manifest.py` was
#   a complete 1,700-line loader with no file anywhere in the repository to load.
# Inputs: `tests/fixtures/plumbing_7day/identity_declaration.yaml` (the owner's Q-31
#   identity declaration, adopted 2026-09-13 under CR-2026-09-13-000102-FIXTURE-WINDOW) —
#   every identity field and every input hash below is TRANSCRIBED from it verbatim, never
#   re-derived. `PreFlight/Technical_Environment_and_Research_Implementation(1)(2).md`
#   §15.2 (the twelve content areas) and §15.4 (the required-output enumeration).
# Re-run behaviour: read-only data. `load_fixture_manifest` is the ONE read path
#   (R-133 control 4). This file is never edited by code; the measuring run emits its own
#   candidate and the owner's Q-31 act freezes it.
#
# ─────────────────────────────────────────────────────────────────────────────────────
# WHAT THIS FILE IS NOT
#
# It is NOT a frozen manifest and it is NOT loadable-clean. `load_fixture_manifest` will
# REFUSE it, by name, at the first MEASURED field it reaches — and that refusal is the
# correct and intended outcome, not a defect in this file.
#
# TE §15.1: "exact counts, tolerances, and runtimes are measured from the fixtures and
# frozen; they are not invented here." Neither fixture has ever run. NO measured figure is
# written below. Every measured quantity carries the literal sentinel `TBD — freeze gate`
# and deliberately carries NO `measuring_run_id`, which is exactly what makes
# `_validate_measured` (R-134 control 8) refuse it. A `measuring_run_id` invented to make
# the loader pass would be the worst possible outcome: an unmeasured manifest disguised as
# a measured one.
#
# Non-measured quantities that are also unfrozen carry the same sentinel with a `source:`
# note naming what would fix them. The loader does not check those, so they are stated
# here plainly rather than hidden.
#
# HOW THIS FILE IS SUPERSEDED — the three steps, unchanged (see README.md in this dir):
#   1. the owner's identity declaration (done, 2026-09-13);
#   2. a MEASURING RUN emits `fixture_manifest.yaml` with `status: candidate` and every
#      measured field carrying that run's registry id — this file is replaced wholesale,
#      never hand-patched;
#   3. the owner's Q-31 freeze act sets `status: frozen`, writes the sibling
#      `fixture_manifest.sha256`, and records that hash under a new D-number.
#      `write_candidate_manifest` refuses any status but `candidate`, so no code path
#      performs step 3.
#
# BLK-02 is UNAFFECTED and stays OPEN. BLK-02 is about measured values being invented, not
# about a file existing; no measured value was written here.
# ─────────────────────────────────────────────────────────────────────────────────────

fixture_id: plumbing_7day

# R-134's two states. `candidate` produces NO WS-20/TA-09/TA-17 evidence and NO receipt.
# A candidate carries no sibling `fixture_manifest.sha256`, and none exists beside this
# file (SD-X-01's negative control).
status: candidate

# --- TE §15.2 area 1 of 12 — Identity ------------------------------------------------
# Transcribed verbatim from identity_declaration.yaml. Identity is BY CITATION, never
# re-derived (R-134, R-135).
identity:
  fixture_id: plumbing_7day
  stations:
    - BSHM
  utc_dates: "2022-11-01..2022-11-07"
  selection_rule: >-
    D-11 (verbatim rationale): November is the closest eligible late-year month to the
    locked test month, and 2022-11-01..07 is deliberately stress-bearing rather than
    quiet: it is November's most disturbed seven-day window, carrying the month's minimum
    provisional Dst of -92 nT. Eligibility judged on derived-artifact verification
    (team.md § Walking Skeleton); smoke test only, never scientific evidence (TC-03f).
  creator: >-
    Kimia Rezaei (student; Q-31 assigns fixture station, dates and acceptance tolerances
    to the Student, TE §18.2)
  approval_status: >-
    adopted 2026-09-13 under Q-31 (student-owned; owner FINAL RULING of 2026-09-13,
    CR-2026-09-13-000102-FIXTURE-WINDOW; no supervisor countersignature required per
    team.md § Walking Skeleton). The IDENTITY is adopted; the MANIFEST is not frozen —
    status above is `candidate`.
  window_citation:
    decision: D-11
    start_utc: "2022-11-01"
    end_utc: "2022-11-07"
  station_citation:
    decision: D-20
    station_id: BSHM
    cell: "32/35"
  aruc_shortfall_status:
    # The register's word is `dormant`, never `discharged`, and the reactivation
    # condition travels with it so the dormancy cannot be misread as closure.
    status: dormant
    reactivation_condition: >-
      D-11 (verbatim): ARUC is short exactly one bin on five of the seven days
      (3-7 November), a uniformity that suggests a systematic single-bin gap rather than
      random loss and should be explained before the manifest is frozen (BLK-02 lineage).
  limitations:
    december_representativeness: not_representative
    clauses:
      - >-
        This window does not reproduce December's winter-solstice regime or its activity
        distribution and must not be treated as representative of the locked month.
      - >-
        Provisional values may characterise fixture selection only. They must not become
        modelling inputs, frozen tolerances, or G-05 regime counts.
  data07_caveat: >-
    DATA-07: this month's provenance is unverifiable in principle, not merely unverified —
    no provider byte stream exists anywhere in the workspace, and the provider-side term of
    the hash arithmetic is zero. Three of the twelve months (2022-04, 2022-07 and 2022-12,
    the locked month) hold no raw_isprint_cache/ at all. The 2026-08-16 corrected extracts
    were produced under Python 3.14, outside the governed 3.11 pin. FULL must not be relied
    on at a freeze gate while its provenance chain points at superseded per-month hashes
    (team.md § Walking Skeleton).
  eligibility_evidence:
    decision: D-11
    source: >-
      evidence/audit_evidence_2022-11/madrigal_coverage_raw_records.csv (D-11/D-20 measured
      basis: BSHM 168/168 hourly bins, 7/7 days)
  # The three TEC-05 stamps (project.md § Mandated).
  phase_id: P1A
  source_id: GNSS_VTEC
  target_definition_id: GRIDDed_VTEC_1H
  # `freeze_citation` is REQUIRED only when status is `frozen`, and is deliberately absent:
  # it names the D-number of the owner's Q-31 freeze act, which has not occurred.

