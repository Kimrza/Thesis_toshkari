# --- TE §15.2 area 10 of 12 — Required outputs ------------------------------------------
required_outputs:
  # TE §15.4's tree, relative to `artifacts/walking_skeleton/plumbing_7day/`. The listing
  # itself does not exist yet — no run has produced an output to hash — so
  # `_validate_hash_listing` (R-133 control 2) refuses on it. The reference is recorded
  # now so the path is declared rather than guessed at measuring time.
  artifact_manifest_ref: ../../../artifacts/walking_skeleton/plumbing_7day/artifact_manifest.json

  # NINETEEN entries: TE §15.4's twenty hash-listable outputs minus
  # `target_uncertainty_budget.json`, which is fixture-2 only. The `.*` entries are kept
  # in TE §15.4's own wildcard form on purpose: the concrete extension is bound by the
  # producing run, and writing `plots/residuals.png` here would be this file inventing a
  # fact about output the project has never produced.
  outputs:
    - input_manifest.yaml
    - processing_config_snapshot.yaml
    - hourly_vtec.parquet
    - feature_table.parquet
    - iri_benchmark.parquet
    - gim_comparator.parquet
    - split_manifest.json
    - mask_manifest.json
    - predictions.parquet
    - metrics.json
    - bootstrap_summary.json
    - checkpoint_manifest.json
    - registry_entry.json
    - plots/target_support.*
    - plots/predictions.*
    - plots/residuals.*
    - plots/quality_diagnostics.*
    - test_report.*
    - clean_run_log.*

  # One entry per required output (R-139), asserted COMPLETE against the list above.
  #
  # `comparison_class` IS THE SENTINEL ON EVERY ENTRY, DELIBERATELY. Assigning an output to
  # `exact` versus `toleranced` decides whether a clean run compares it byte-for-byte or
  # within a tolerance, which is a governed reproducibility decision under TE §13.7 ("exact
  # equality is required for hashes, schemas, partition membership, IDs and deterministic
  # CPU transformations; floating-point predictions and metrics use fixture-derived
  # tolerances"). An implementer choosing it by convenience is precisely what TE §1.1
  # forbids. The loader refuses each entry by name until the classes are frozen.
  #
  # Two constraints that apply the moment they ARE frozen, recorded here so they are not
  # rediscovered late:
  #   * a `toleranced` entry's `fp_tolerance` is MEASURED and carries its
  #     `measuring_run_id` (R-134);
  #   * a `toleranced` entry declaring TECU units whose producing path declares no
  #     `inverse_route` is NOT freezable (BLK-08 down-arrow; R-139 control 25).
