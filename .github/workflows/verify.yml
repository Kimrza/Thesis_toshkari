name: verify

# Governed-evidence verification suite.
#
# WHY THIS EXISTS. The remediation of 2026-08-21 added tests that cannot be executed on
# the authoring machine: no Python interpreter is installed (the Windows Store `python3`
# stub only), no `py` launcher, no virtualenv, no WSL distribution, and PyPI is
# unreachable from that environment, so neither an interpreter nor pytest can be obtained
# locally. This workflow is the executable path. It is committed but **not** pushed by the
# agent that wrote it; pushing it, and therefore running it, is the owner's action.
#
# It deliberately does NOT install scientific dependencies. The three modules it runs are
# stdlib-only by design (hashlib, csv, json, ast, pathlib), so a bare interpreter plus
# pytest is the whole requirement. That keeps the reproducibility check independent of the
# modelling stack, per NFR-REP-01.
#
# Authority: TE §9.1 (two governed platforms), §13.2 (ordered clean-run contract),
# §13.7 (exact equality for hashes), §12 (`tests/` tree).
#
# ══════════════════════════════════════════════════════════════════════════════════════
# THE BOUND (added 2026-09-20; GOV-2026-09-20-CG-01 Recommendation 47, owner authorised
# the board's preferred option 1). READ THIS BEFORE CITING ANY OUTPUT OF THIS WORKFLOW.
#
# TC-03c and TE §9.1 authorise EXACTLY TWO execution platforms: Kaggle (primary compute,
# Phase 1 acquisition/audit host) and local (development, small tests, fixture runs,
# review). `team.md` § Testing Posture records "No CI service is used." A GitHub-hosted
# runner is neither, and this workflow executes the suite on two of them.
#
# It is retained, not deleted, on the reading that TE §9.1 bounds GOVERNED COMPUTE rather
# than all execution — and it is retained ONLY inside this bound:
#
#   1. GitHub Actions is a NON-SCIENTIFIC verification surface. Nothing it does is
#      evidence for any TEC gate, any WS row, any TA row, or any claim in the thesis.
#   2. No run of this workflow may PRODUCE, HASH or ATTEST a governed artifact. It writes
#      nothing into `artifacts/` or `evidence/`, and the structural guard in the final
#      step FAILS the job if it did. That guard is what makes limb 2 checkable rather
#      than merely promised.
#   3. A green run is NOT the §18.3 preflight gate, NOT TC-03g's in-session gate, and NOT
#      G-07 evidence. TC-03g requires the critical set and both fixtures to run INSIDE
#      the Kaggle session, because a Kaggle session carries no git working tree and a run
#      anywhere else proves nothing about the environment a governed run executes in.
#   4. `team.md`'s "No CI service is used." is now inaccurate and is owed a correction at
#      the next practices-affirmation gate. That is a memory-layer write and is NOT made
#      here: the §13 learnings ritual is its only sanctioned path.
#
# OWED, and NOT discharged by this annotation: the change record recording GitHub Actions
# as an authorised non-scientific surface. Owner is Student + Supervisor, due G-07
# (Recommendation 47's own closure evidence names both the change record AND this
# annotation; only the second exists).
#
# ── ESCALATION, beyond what Recommendation 47 examined ────────────────────────────────
# `git ls-files evidence/locked_test_restricted/` returns **29 tracked files** (derived
# 2026-09-20, printed before assertion), and the root appears nowhere in `.gitignore`.
# The locked December 2022 test data is therefore committed, and the remote is
# `https://github.com/Kimrza/Thesis_toshkari.git`. Two consequences the two-platform
# finding did not reach:
#
#   (a) Every `actions/checkout` below materialises the locked month onto third-party
#       infrastructure, and the three restricted-reader modules then READ it there.
#       Recommendation 30 held that a December read triggered by `git commit` is not a
#       governed access because no per-occasion authorization exists; a December read
#       triggered by a `push` webhook on a runner nobody authorised is the same defect on
#       a worse surface.
#   (b) Those reads emit `AccessRecord` rows into an ephemeral runner filesystem that is
#       destroyed with the job, so the access is unrecorded in any durable artifact.
#
# NO UNILATERAL CHANGE IS MADE FOR (a) OR (b). Deleting the workflow, un-tracking the
# restricted root, or narrowing the suite each trade one governance property for another,
# and all three are owner acts. This is recorded as an OPEN RULING owed alongside
# Recommendation 47's change record, and as an input to the G-09 disposition that already
# holds the related history-immutability question.
#
# ── 2026-09-27 UPDATE (GOV-2026-09-27-BT-02 R2, Student-approved 2026-09-27) ──────────
# The suite-narrowing option above is now EXECUTED as the approved immediate step: the
# restricted-root reader modules are deselected below (see the "Full tests/ directory"
# step and the two removed dedicated steps), so this workflow no longer READS the locked
# December root on any push — limb (a)'s reads and limb (b)'s ephemeral access records
# are closed for reads. STILL OPEN: `actions/checkout` still MATERIALISES the 29 tracked
# restricted files on the runner (untracking is an owner act this remediation may not
# take), and the Rec 47 Student + Supervisor authorization change record is still owed —
# both consolidated in governance/CHANGE_RECORD_2026-09-27_platform_bound_RULING_REQUEST.md.
# Additionally, `resolve_platform_roots` now REFUSES GITHUB_ACTIONS/CI-marked
# environments instead of silently defaulting them to `local` (R3); this workflow
# therefore declares TEC_PLATFORM=local EXPLICITLY at job level, an auditable
# declaration under this bound, replacing the silent default the guard used to grant.
# ══════════════════════════════════════════════════════════════════════════════════════

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  governed-evidence:
    name: governed evidence (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    env:
      # R3 (GOV-2026-09-27-BT-02): the platform guard refuses CI-marked environments
      # rather than defaulting them to `local`. This is the explicit, auditable
      # declaration that replaces the silent default — valid ONLY under the Rec 47
      # non-scientific bound above; it makes nothing here governed evidence.
      TEC_PLATFORM: local
    strategy:
      fail-fast: false
      matrix:
        # Both platforms, because the defect this suite guards against -- line-ending
        # normalization breaking every recorded SHA-256 -- is platform-dependent and was
        # invisible on Linux. A Windows-only or Linux-only run would have missed it.
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Check out with line-ending conversion disabled
        # autocrlf=false plus the committed .gitattributes is the combination that keeps
        # governed bytes byte-exact. If a future change re-enables conversion, the hash
        # assertions below fail rather than passing quietly.
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
        shell: bash

      - uses: actions/checkout@v4

      - name: Report the line-ending state of governed paths
        run: |
          git config core.autocrlf || true
          git ls-files --eol evidence | head -20 || true
        shell: bash

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install governed dependencies
        run: python -m pip install --upgrade pip pytest -r requirements.txt

      # The dedicated "Release-hash verification" and "Acquisition-window and
      # locked-month custody" steps were REMOVED 2026-09-27 (GOV-2026-09-27-BT-02 R2,
      # Student-approved): both modules read the restricted December root, and running
      # them here was the recurring third-party December read the open ruling records.
      # They remain in the local gate suite and the §18.3 selection (b) — CI narrowing
      # never narrows the critical-test obligation (GOV-F-06's logic; the deselection
      # is a platform-custody act, not a test-set redefinition).
      - name: Phase-boundary enforcement
        run: python -m pytest tests/test_phase_boundary.py -v -rs

      - name: Full tests/ directory (restricted-root readers deselected — R2)
        # --ignore is collection-time deselection: test_release_hashes previously
        # failed at COLLECTION on a refused restricted read, so ignore (not -k) is
        # the correct mechanism. The five ignored modules are the restricted-root
        # readers (the three named by item 9 plus the acquisition-window reader and
        # the merge-script restricted-reads module); over-breadth is deliberate
        # fail-safe pending the owner's consolidated platform ruling.
        run: >
          python -m pytest tests/ -v -rs
          --ignore=tests/test_release_hashes.py
          --ignore=tests/test_acquisition_window.py
          --ignore=tests/test_common_masks.py
          --ignore=tests/test_locked_test_guard.py
          --ignore=tests/test_merge_script_restricted_reads.py

      - name: Restricted-path invariant, independent of pytest
        # A second, deliberately redundant check: no December 2022 record outside the
        # restricted custody root. Independent of the test module in case that module is
        # ever narrowed the way its predecessor was (finding VAL-3).
        shell: bash
        run: |
          set -euo pipefail
          violations=0
          while IFS= read -r f; do
            case "$f" in evidence/locked_test_restricted/*) continue ;; esac
            n=$(awk -F, 'NR==1{for(i=1;i<=NF;i++) if($i=="date") c=i; next} $c ~ /^2022-12/ {k++} END{print k+0}' "$f")
            if [ "$n" -gt 0 ]; then
              echo "VIOLATION: $f holds $n December 2022 records outside the restricted root"
              violations=$((violations+1))
            fi
          done < <(find evidence -name 'madrigal_coverage_raw_records.csv')
          echo "violations: $violations"
          test "$violations" -eq 0

      - name: Structural guard — this surface produced no governed artifact
        # Recommendation 47's bound, limb 2, made CHECKABLE rather than promised.
        #
        # A non-scientific verification surface that quietly wrote into `artifacts/` or
        # `evidence/` would be producing governed evidence on an unauthorised platform --
        # precisely the outcome the bound exists to prevent, and precisely the kind of
        # thing nobody notices until a gate reviewer finds an artifact whose producing
        # environment cannot be named.
        #
        # `git status --porcelain` over the two governed roots is the whole check: the
        # suite is a pure check by contract (it "writes nothing, mutates nothing"), so any
        # difference here is either a test that writes where it must not, or a run that
        # produced evidence. Untracked files are included (`--porcelain` reports `??`),
        # because a NEW artifact is the more likely form. It runs LAST so it observes the
        # cumulative effect of every preceding step.
        #
        # FAILING THIS STEP IS NOT A FLAKE. Find the writer; do not relax the guard.
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          changed=$(git status --porcelain -- artifacts evidence)
          if [ -n "$changed" ]; then
            echo "BOUND VIOLATED: this workflow wrote into a governed root." >&2
            echo "$changed" >&2
            echo "GitHub Actions is a NON-SCIENTIFIC verification surface (Rec 47)." >&2
            echo "It may not produce, hash or attest a governed artifact." >&2
            exit 1
          fi
          echo "governed roots clean: no artifact produced, hashed or attested here"
