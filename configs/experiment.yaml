# configs/experiment.yaml — one of the four governed configs (TE §12; TC-03e).
#
# Foundation owns no experiment science. Every scientific field carries the
# literal `TBD — freeze gate` sentinel until its owning unit transcribes the
# frozen value under its D-number (folds/embargo: features-and-splits; grids and
# model configuration: models-and-baselines; estimand and bootstrap parameters:
# statistical-inference/evaluation-and-comparison; ablations: TE §7.2 named
# runs). No implementer may fill a sentinel by convenience (Vision §1.2;
# TE §1.1); grids are exact and committed before G-05 and never change after
# December is seen (project.md § Forbidden).
#
# No machine path may appear in this file (R-16, ADR-07).

schema_version: "1.0.0"

folds: "TBD — freeze gate"
embargo_hours: "TBD — freeze gate"

# --- frozen hyperparameter grids (D-121, Vision §14.2 line 1206: "Exact frozen grids:
# ridge 6, RF 18, LSTM 16 combinations, with fixed training settings" — Approved).
# Contents transcribed VERBATIM from Vision §8.6 "Frozen Hyperparameter Grids" (the grid
# table) by models-and-baselines code-generation Q5=A (2026-09-06), recorded in
# governance/CHANGE_RECORD_2026-09-06_BLK03_confirmatory_contract.md. This is a COPY of an
# approved decision under its D-number, exactly as seeds.yaml copies D-122; no value was
# chosen here. §8.6: "Grids are exact, committed to configuration before G-05, and identical
# in structure across families. No broad automated architecture optimization is permitted,
# and no range may be changed after December is seen." The grid lives ONCE, here; what is
# frozen and compared before G-05 is its hash (R-96); `combinations` is D-121's own count
# and the code asserts the enumerated product of the axes equals it (content, not only
# immutability).
grids:
  decision: "D-121"
  source: "Vision §8.6, grid table; Vision §14.2 line 1206"
  ridge: # M-04 — Vision §8.6 row "Ridge | alpha ∈ {0.01, 0.1, 1, 10, 100, 1000} | 6"
    model_id: "M-04"
    axes:
      alpha: [0.01, 0.1, 1, 10, 100, 1000]
    combinations: 6 # D-121
  random_forest: # M-05 — Vision §8.6 row "Random Forest | n_estimators ∈ {300, 600} ×
    # max_depth ∈ {8, 16, None} × min_samples_leaf ∈ {1, 5, 20}, max_features = sqrt | 18"
    model_id: "M-05"
    direct_only: true # D-120 / TE §8.2: direct RF only; residual RF removed
    axes:
      n_estimators: [300, 600]
      max_depth: [8, 16, null] # `None` in §8.6 is YAML `null`
      min_samples_leaf: [1, 5, 20]
    fixed:
      max_features: "sqrt" # §8.6: "max_features = sqrt"
    combinations: 18 # D-121
  lstm: # M-06 — Vision §8.6 row "LSTM | layers ∈ {1, 2} × units ∈ {32, 64} ×
    # learning_rate ∈ {1e-3, 3e-4} × batch_size ∈ {64, 256} | 16"
    model_id: "M-06"
    direct_only: true # D-120 / TE §8.2: compact direct LSTM only; residual LSTM and GRU removed
    axes:
      layers: [1, 2]
      units: [32, 64]
      learning_rate: [1.0e-3, 3.0e-4]
      batch_size: [64, 256]
    combinations: 16 # D-121

# --- model configuration -----------------------------------------------------------------
# Only the seven fixed LSTM training settings are transcribed (Vision §8.6, the sentence
# immediately below the grid table, quoted verbatim in `source_text`; D-121 "with fixed
# training settings"). Everything else under `models` that D-121 / §8.6 does not fix stays
# `TBD — freeze gate`: the per-track declared baseline of Vision §8.7 / D-124 is named in
# configuration before tuning begins and is its owner's transcription, not this pass's.
models:
  lstm_fixed_settings:
    decision: "D-121"
    source: "Vision §8.6, fixed LSTM training settings sentence"
    source_text: >-
      Fixed LSTM training settings: dropout 0.2, Adam optimizer, MSE loss, maximum 100
      epochs, early-stopping patience 10 epochs monitored on validation RMSE, minimum
      improvement tolerance 1e-4 TECU, best-checkpoint restoration rather than last epoch.
    dropout: 0.2 # setting 1
    optimizer: "Adam" # setting 2
    loss: "MSE" # setting 3
    max_epochs: 100 # setting 4
    early_stopping_patience: 10 # setting 5 — patience in epochs …
    early_stopping_monitor: "validation_rmse" # … monitored on validation RMSE
    min_improvement_tecu: 1.0e-4 # setting 6
    checkpoint_policy: "best_checkpoint" # setting 7 — restoration of the lowest-validation-RMSE
    # checkpoint, never the last epoch (R-94; WS-15; TA-13)
  declared_baseline_per_track: "TBD — freeze gate" # Vision §8.7 / D-124 — not transcribed here
  selection: "TBD — freeze gate" # Vision §8.7 / D-124: mean per-fold skill, 1% simplicity rule — not transcribed here
  # The SELECTED configuration per track (R-101: chosen on mean per-fold skill over F1–F4,
  # January–November only; refit changes no hyperparameter; frozen before G-05 among TE §7.0B's
  # immutable items). Written by the tuning run's selection record, never by an implementer;
  # 06_train_and_predict.py REFUSES naming this field while it is unset. Shape only (W-9).
  selected: "TBD — freeze gate"

# --- estimand (Vision §2.3; TE §1.3) -------------------------------------------------------
# Transcribed VERBATIM from the frozen orientation/weighting by statistical-inference
# code-generation Q4=A (2026-09-06), recorded in
# governance/CHANGE_RECORD_2026-09-06_R119_bootstrap_confirmations.md. This is a COPY of an
# approved decision under citation, exactly as seeds.yaml copies D-122; no value was chosen
# here. The sibling's code (src/evaluation/metrics.py EstimandResult) already refuses any
# other orientation/weighting/sentence, so config-versus-code drift is caught by test.
estimand:
  decision: "CR-2026-09-06-R119-BOOTSTRAP-CONFIRMATIONS (proposed D-number pending owner adoption)"
  source: "Vision §2.3; TE §1.3"
  orientation: "benchmark_minus_model" # Vision §2.3: mean within-station difference of squared errors, benchmark minus model
  weighting: "equal_station" # Vision §2.3 / TE §1.3: unweighted mean of the per-station values
  sign_convention_sentence: "positive values favour the model: the differential is benchmark minus model"

# --- bootstrap (TE §13.6; TC-19 binding: hard; D-122; D-28's 720-h scored-set arithmetic) ---
# Frozen values transcribed and the three gate confirmations recorded by
# statistical-inference code-generation Q1=A/Q2=A/Q3=A/Q4=A (2026-09-06), per
# governance/CHANGE_RECORD_2026-09-06_R119_bootstrap_confirmations.md. NEVER substitute a
# within-station or naive bootstrap (project.md § Forbidden; the Q-27 rejection): the
# within-station variant exists in code ONLY as the quarantined widening comparator, never
# a reported interval. The seed is NOT here: 20221201 lives in seeds.yaml (seed_key below;
# D-122; ADR-05 carve-out — seed_everything never touches it). TE §15.3's reduced fixture
# replicate count is an apparatus constant of the fixture manifest, NOT a field here
# (GOV-2026-08-28-FD-01 Recommendation 24). The 48-hour sensitivity's run_id is the owner's
# TE §7.2 registration act and is not transcribed here.
bootstrap:
  decision: "CR-2026-09-06-R119-BOOTSTRAP-CONFIRMATIONS (proposed D-number pending owner adoption)"
  source: "TE §13.6; TC-19; D-122; D-28"
  block_hours: 24 # TE §13.6: 24-hour blocks carrying all three stations together; 30 blocks on DEC
  replicates: 10000 # TE §13.6 / TC-19: 10,000 replicates (the rejected variant's 2,000 never resurrected)
  confidence_level: 0.95 # TE §13.6: report 95% confidence intervals
  sensitivity_block_hours: 48 # TE §13.6 / TA-14: the predeclared 48-hour sensitivity; 15 blocks on DEC
  seed_key: "seeds.bootstrap" # D-122: 20221201 in seeds.yaml; ADR-05 carve-out
  interval_method: "percentile" # Q1=A: 2.5th/97.5th percentiles of the replicate set (R-119)
  block_scheme: "fixed_nonoverlapping" # Q2=A: contiguous non-overlapping partition aligned to the scored range (R-115; Rec 26)
  correlation_series: "paired_error_pearson_all_pairs" # Q3=A: Pearson on d_s(t), all three station pairs (R-121)

# --- comparison sets (R-106; NFR-FAIR-01/TC-16: one comparison-wide mask per declared set) --
# Memberships CONFIRMED by the project decision owner at the evaluation-and-comparison
# code-generation gate (Q1=A, 2026-09-06), recorded in
# governance/CHANGE_RECORD_2026-09-06_R106_comparison_sets.md with a proposed D-number for
# evidence/DECISIONS.md (owner adopts or edits; no agent writes the register). Grounding:
# Vision §2.4 tiers 1–3 (primary + difficulty controls; GIM; ridge/RF learned-model tier),
# §8.4's model table (M-04 ridge, M-05 direct RF, M-06 LSTM), §8.9's matched-window and
# matched-learned-model clauses. Separate sets, separate masks, NEVER merged silently — a
# secondary comparator's availability must not shrink the primary scored set
# (GOV-2026-08-28-FD-01 Recommendation 19). The mask builder checks passed predictions
# against the declared set EXACTLY (missing/extra/duplicate/merged all refuse); tests
# re-read the member counts 5 / 2 / 3 from this block, never from a source literal.
comparison_sets:
  decision: "CR-2026-09-06-R106-COMPARISON-SETS (proposed D-number pending owner adoption)"
  source: "Vision §2.4 tiers 1–3; Vision §8.4 model table; Vision §8.9 matched-window clause"
  primary:
    member_ids: ["M-01", "M-02", "M-03", "M-06", "B-01"] # 5 members, one mask
    model_id: "M-06"
    benchmark_ids: ["B-01", "M-01", "M-02", "M-03"] # B-01 plus the three difficulty controls
  gim:
    member_ids: ["M-06", "C-01"] # 2 members, its own mask (Vision §6.10; TE §5.2)
    model_id: "M-06"
    benchmark_ids: ["C-01"] # evaluation-time-only comparator, never presumed independent
  tier3:
    member_ids: ["M-04", "M-05", "M-06"] # 3 members, its own mask (Vision §2.4 tier 3, §8.9)
    model_id: "M-06"
    benchmark_ids: ["M-04", "M-05"] # ridge and direct RF, matched causal window (§8.9)

# --- ablation registry (TE §7.2 "Ablation registry (Q-18, Q-17, Q-11)") -------------------
# TE §7.2: "Ablations are named, predeclared runs, not exploratory experiments invented after
# results are seen. Each is registered in experiment.yaml with its own run ID and executes on
# frozen January–November folds only, using identical folds, masks, tuning budget, and the
# mean-skill selection rule of Vision §8.7." The FIVE named entries below transcribe §7.2's
# table — identities, Phase-1 reachability, the §7.2 question and configuration change
# quoted, and the two named constraints. What §7.2 does NOT fix stays `TBD — freeze gate`:
# each entry's `run_id` and `registered_at` (R-97: registered with a run ID BEFORE the
# freeze) are the owner's registration act, not this pass's. Five named, four reachable in
# Phase 1 — stated both ways so the count is not quietly reduced (R-97). No ablation
# configuration may be promoted to primary once the locked test is opened (TE §7.2).
ablations:
  source: "TE §7.2 ablation registry table"
  entries:
    ABL-NODOY:
      question: "Does December skill depend on a seasonal encoding the model has seen only once?"
      configuration_change: "Drop doy_sin, doy_cos; all else identical"
      primary_remains: "Full feature set"
      phase1_reachable: true
      run_id: "TBD — freeze gate"
      registered_at: "TBD — freeze gate"
    ABL-DIFF:
      question: "Does a first-difference target improve learning?"
      configuration_change: >-
        Target becomes y_{t+1} - y_t; predictions inverse-transformed to absolute TECU before
        any metric is computed
      primary_remains: "Raw TECU"
      phase1_reachable: true
      inverse_before_metric: true # TE §7.2 implementation rule; D-27 (inverse is ABL-DIFF's alone)
      run_id: "TBD — freeze gate"
      registered_at: "TBD — freeze gate"
    ABL-NOSW:
      question: "Do forecast-safe space-weather features add value beyond lagged VTEC and time?"
      configuration_change: "Drop kp_safe, ap_safe, hp60_safe, ap60_safe, f107_safe, f107_81_trailing"
      primary_remains: "Full feature set"
      phase1_reachable: true
      run_id: "TBD — freeze gate"
      registered_at: "TBD — freeze gate"
    ABL-HIST48:
      question: "Is 24 h the right history length?"
      configuration_change: "48 h window and 48-step sequence. Runs only after the primary configuration is frozen."
      primary_remains: "24 h"
      phase1_reachable: true
      after_primary_freeze_only: true # TE §7.2 (bold in the source); R-97
      run_id: "TBD — freeze gate"
      registered_at: "TBD — freeze gate"
    ABL-ZENITH:
      question: "Does zenith-weighted aggregation change the target materially?"
      configuration_change: "Zenith-weighted hourly aggregate (Vision §6.6); representative days only"
      primary_remains: "IPP median"
      phase1_reachable: false
      phase_deferral: "Phase 2 — varies the hourly aggregation of the target, a choice that does not exist on the Phase 1 location-sampled gridded target (domain-entities § 8; R-97)"
      run_id: "TBD — freeze gate"
      registered_at: "TBD — freeze gate"

# --- regimes (Vision §9.3; D-13; D-11) -----------------------------------------------------
# Transcribed VERBATIM from Vision §9.3's frozen thresholds and storm-event rule and D-13's
# demotion threshold by regimes-diagnostics-reporting code-generation Q1=A (2026-09-06),
# recorded in governance/CHANGE_RECORD_2026-09-06_R123_regimes_and_reporting.md. This is a
# COPY of frozen decisions under citation, exactly as the grids block copies D-121; no value
# was chosen here, and a test asserts the copy's exactness (the only new claim Q1=A makes).
# The classifier and count_storm_events in src/evaluation/regimes.py read ONLY this block via
# ConfigSnapshot — no threshold literal exists in source (TC-03e; FR-P1-05-18 clause 3 by
# construction). D-11 bars any provisional-Dst-derived figure from a G-05 regime count; the
# count source is GFZ Kp/Hp60 at a recorded release grade (D-13 "Source of the count").
regimes:
  decision: "CR-2026-09-06-R123-REGIMES-AND-REPORTING (proposed D-number pending owner adoption)"
  source: "Vision §9.3; D-13; D-11"
  thresholds:
    quiet_kp_below: 4 # Vision §9.3: Quiet: Kp < 4
    disturbed_kp_min: 4 # Vision §9.3: Disturbed: Kp >= 4
    storm_kp_min: 5 # Vision §9.3: Storm: Kp >= 5
  event_window:
    pre_hours: 12 # Vision §9.3: reporting window −12 h …
    post_hours: 24 # … to +24 h around each event
  event_definition: "contiguous interval of Kp>=5" # Vision §9.3 storm event rule; D-13
  independence_min_quiet_hours: 24 # Vision §9.3 / D-13: independent if separated by >=24 h of Kp<4
  independent_storm_event_threshold: 3 # D-13: >=3 independent December storm events, else demotion
  count_source: "GFZ Kp/Hp60 at a recorded release grade; provisional Dst barred (D-11)" # D-13
  # WHICH December day range governs D-13's comparison count is a Student + Supervisor gate
  # item (GOV-2026-08-28-FD-01 Rec 15; R-124/W-2 point 5: mechanism written, value routed).
  # While the sentinel stands, the audit-count consistency path REFUSES naming this field.
  december_day_range: "TBD — freeze gate"
  # D-17's observation-quality strata fields — referenced by their decision (D-17
  # § Observation-quality strata), not re-enumerated as new content; the sixteen-field
  # target-row contract itself stays in D-17. An enumerated set, never free strings (R-127).
  d17_quality_strata:
    decision: "D-17"
    fields: ["valid_observation_count", "within_hour_spread_tecu", "provider_dtec_summary"]

# practical_relevance_threshold — the SENTINEL IS THE DECIDED STATE, not an open question.
# The project decision owner ruled on 2026-09-10 that NO numeric threshold is set and that
# the RULE is the frozen object (draft D-B in
# governance/CHANGE_RECORD_2026-09-10_owner_rulings_implementation.md; the D-number is the
# owner's to adopt). The protocol, transcribed from Vision §5.4 and PC-09 without addition:
#   1. Ten percent RMSE reduction is a NAMED REFERENCE MAGNITUDE, not a pass/fail rule and
#      not a hypothesis.
#   2. Practical relevance is reported DESCRIPTIVELY unless the supervisor explicitly
#      approves a threshold (PC-09, binding: hard).
#   3. An approved reference or threshold shall not correspond to an RMSE difference
#      smaller than the target uncertainty budget of Vision §6.9; if it does, practical
#      relevance is reported descriptively only.
#   4. No threshold may be introduced, changed or reinterpreted after December is opened
#      (Vision §5.4; PC-09; project.md § Forbidden).
#   5. Significance and usefulness stay distinct: the confirmatory claim is the paired loss
#      differential with its 95% interval (Vision §2.3/§5.5); a practical-relevance
#      statement is descriptive commentary beside it, never a second test.
# Any future numeric requires an explicit supervisor approval and its own D-number, and is
# barred once December is opened. No implementer may fill this by convenience (TE §1.1).
practical_relevance_threshold: "TBD — freeze gate" # decided: no threshold approved (D-B draft)
