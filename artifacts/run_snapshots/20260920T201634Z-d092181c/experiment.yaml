# --- reporting: the FR-P1-05-10 top-1% sensitivity ----------------------------------------
# NOT RESOLVED, and deliberately written as sentinels rather than left absent, so the two
# choices a human still owes are visible at the point of use (W-9: writing a sentinel is not
# choosing a value). `src/evaluation/diagnostics.py: read_top1pct_declaration` refuses on
# either sentinel and names the field, so nothing runs on a default.
#
# WHAT IS ALREADY SETTLED, and is NOT being re-asked:
#   * ranking variable  — the absolute error |y_hat - y_true| of each masked row. Fixed by
#     FR-P1-05-10's own wording ("top 1% of absolute errors removed").
#   * tie handling      — ties break by (station, interval_start_utc) ascending, so the
#     removal is deterministic on both governed platforms (WS-17 posture). Implemented.
#   * how many rows     — k = ceil(removed_fraction * n): `ceil`, never round or floor, so a
#     declared removal never silently removes nothing on a small support. Implemented.
#   * exclusion and comparison procedure — the removed rows are dropped and every metric is
#     RECOMPUTED on the remainder; the sensitivity is reported as its own labelled figure and
#     is NEVER merged with the primary result (Vision §2.4 honesty rule). Implemented.
#   * a support on which the rule would remove every row refuses; the remainder must be
#     non-empty for the recomputed metrics to exist. Implemented.
#
# WHAT IS STILL OWED — two values, both the owner's/supervisor's:
#
# 1. `removed_fraction` — the "1%" itself, as a literal fraction (0.01 is the obvious
#    reading of "top 1%", but the literal belongs in a freeze act, not in an implementer's
#    edit: TC-03e, TE §18.3).
#
# 2. `scope` — WHOSE top 1%. FR-P1-05-10 does not say, and under the project's equal-station
#    weighting (Vision §2.3) the two readings differ materially:
#      - "comparison_wide": rank every masked row across all three stations together and drop
#        the largest fraction. The literal reading of the requirement's wording. A station
#        with systematically larger errors loses a larger share of its rows, so the
#        equal-station mean is then taken over UNEQUAL per-station supports.
#      - "per_station": rank within each station and drop that station's own largest fraction.
#        Supports stay proportionate and equal-station weighting keeps its meaning, but the
#        rows removed are not the comparison's largest errors.
#    `comparison_wide` is the module's coded DEFAULT because it is the literal reading; it is
#    a default, not a decision, and this field is what the gate rules on.
#    Routed as GOV-2026-09-20-CG-01 Recommendation 21 / dispositions §5 item 14 — SUPERVISOR,
#    due before G-06. Nothing in Phase 1 before that gate reads this block.
reporting:
  top1pct_sensitivity:
    decision: "OPEN — GOV-2026-09-20-CG-01 Rec 21; dispositions §5 item 14 (Supervisor, before G-06)"
    removed_fraction: "TBD — freeze gate"
    scope: "TBD — freeze gate" # one of: comparison_wide | per_station
