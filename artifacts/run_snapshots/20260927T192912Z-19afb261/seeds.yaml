# configs/seeds.yaml — one of the four governed configs (TE §12; TC-03e).
#
# Frozen values below enter ONLY from an approved decision record. Source:
# D-122 (Vision §14.2), status "Approved — supervisor sign-off pending at G-05".
# That pending-signature status is carried, not smoothed: the values are frozen
# for implementation and still owe a signature at G-05 (security-design SD-06).
#
# NFR-DET-01 / TC-21: fixed seeds, three-seed element-wise mean as the
# confirmatory prediction. NEVER select a seed on validation or after seeing
# December (project.md § Forbidden).
#
# No machine path may appear in this file (R-16, ADR-07).

schema_version: "1.0.0"

# Development seed — used by seed_everything for every non-confirmatory context.
development: 42 # D-122

# Confirmatory seeds — each is its own registry run (TE §13.5); the element-wise
# mean of the three runs' predictions is the confirmatory prediction.
final: # D-122
  - 1337
  - 2024
  - 7

# Bootstrap seed — consumed ONLY by src/evaluation/bootstrap.py (ADR-05 carve-out:
# seed_everything never touches it). Vector time-block bootstrap, 10,000
# replicates, 95% CI (TE §13.6; TC-19).
bootstrap: 20221201 # D-122

# Determinism probe expectations (R-06 cross-check input): operations declared
# expected-nondeterministic. Empty means "none declared", which the probe
# cross-checks against observation; an empty nondeterministic_ops result is
# never proof of determinism (R-06).
determinism:
  expected_nondeterministic_ops: []
